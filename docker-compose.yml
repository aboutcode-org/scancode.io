name: scancodeio

x-description: "Full ScanCode.io stack: all services, local image build"

services:
  db:
    image: docker.io/library/postgres:17.11
    env_file:
      - docker.env
    volumes:
      - db_data:/var/lib/postgresql/data/
    shm_size: "1gb"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:8.10.2-alpine
    # Enable redis data persistence using the "Append Only File" with the
    # default policy of fsync every second. See https://redis.io/topics/persistence
    command: redis-server --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/aboutcode-org/scancode.io:v38.1.0-full
    command: sh -c "
        ./manage.py migrate &&
        ./manage.py collectstatic --no-input --verbosity 0 --clear &&
        gunicorn scancodeio.wsgi:application --bind :8000 --timeout 600 \
          --workers ${GUNICORN_WORKERS:-8} --worker-tmp-dir /dev/shm"
    env_file:
      - docker.env
    expose:
      - 8000
    volumes:
      - .env:/opt/scancodeio/.env
      - /etc/scancodeio/:/etc/scancodeio/
      - workspace:/var/scancodeio/workspace/
      - static:/var/scancodeio/static/
      - healthycode_venv:/opt/healthycode
      - atom_root:/atom-root
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/aboutcode-org/scancode.io:v38.1.0-full
    # Ensure that potential db migrations run first by waiting until "web" is up
    command: wait-for-it --strict --timeout=600 web:8000 -- sh -c "
        ./manage.py rqworker --worker-class scancodeio.worker.ScanCodeIOWorker
                             --queue-class scancodeio.worker.ScanCodeIOQueue
                             --verbosity 1"
    env_file:
      - docker.env
    volumes:
      - .env:/opt/scancodeio/.env
      - /etc/scancodeio/:/etc/scancodeio/
      - workspace:/var/scancodeio/workspace/
      - healthycode_venv:/opt/healthycode
      - atom_root:/atom-root
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  nginx:
    image: docker.io/library/nginx:1.31.6-alpine
    ports:
      - "${NGINX_PUBLISHED_HTTP_PORT:-80}:80"
      - "${NGINX_PUBLISHED_HTTPS_PORT:-443}:443"
    volumes:
      - ./etc/nginx/conf.d/:/etc/nginx/conf.d/
      - static:/var/scancodeio/static/
      - webroot:/var/www/html/
    depends_on:
      web:
        condition: service_started
    restart: always

  clamav:
    image: docker.io/clamav/clamav:1.5.4_base
    volumes:
      - clamav_data:/var/lib/clamav
      - workspace:/var/scancodeio/workspace/
    restart: always

  healthycode:
    profiles:
      - healthycode
    image: ghcr.io/aboutcode-org/healthycode:0.2.0
    volumes:
      - healthycode_venv:/opt/healthycode
    restart: "no"

  atom:
    profiles: [atom]
    image: ghcr.io/appthreat/atom:v3.2.0
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        find /atom-root -mindepth 1 -delete
        mkdir -p /atom-root/opt /atom-root/bin /atom-root/lib/node_modules
        cp -a /opt/wrapper /opt/java /opt/maven /opt/sbt /opt/scala /opt/vendor /atom-root/opt/
        cp /usr/bin/node-22 /atom-root/bin/node
        for lib in $(ldd /usr/bin/node-22 | awk '/=>/{print $$3}'); do
          case "$$lib" in */libc.so*|*/libm.so*|*/libpthread*|*/libdl.so*|*/librt*|*/ld-linux*) ;; *) cp -aL "$$lib" /atom-root/lib/ ;; esac
        done
        cp -a /usr/local/lib/node_modules/. /atom-root/lib/node_modules/
        ln -sfn /atom-root/opt/wrapper/nodejs/packages/atom /atom-root/opt/wrapper/nodejs/packages/atom-jar /atom-root/lib/node_modules/@appthreat/
        printf '#!/bin/sh\nexport LD_LIBRARY_PATH=/atom-root/lib\nexport JAVA_HOME=/atom-root/opt/java/26.0.1-tem\nexport PATH=/atom-root/opt/java/26.0.1-tem/bin:/atom-root/opt/maven/3.9.16/bin:/atom-root/opt/sbt/1.12.12/bin:/atom-root/opt/scala/3.8.4/bin:/atom-root/opt/vendor/bin:$$PATH\nexec /atom-root/bin/node /atom-root/opt/wrapper/nodejs/packages/atom/index.js "$$@"\n' > /atom-root/bin/atom
        chmod +x /atom-root/bin/atom
    volumes: [atom_root:/atom-root]
    restart: "no"

volumes:
  db_data:
  redis_data:
  clamav_data:
  static:
  workspace:
  webroot:
  healthycode_venv:
  atom_root: