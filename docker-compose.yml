name: scancodeio

x-description: "Full ScanCode.io stack: all services, local image build"

services:
  db:
    image: docker.io/library/postgres:17.11
    env_file:
      - docker.env
    volumes:
      - db_data:/var/lib/postgresql/data/
    shm_size: "1gb"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:8.10.2-alpine
    # Enable redis data persistence using the "Append Only File" with the
    # default policy of fsync every second. See https://redis.io/topics/persistence
    command: redis-server --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opt-in Docker-in-Docker daemon.
  # It is not started by default. Enable it with:
  #     docker compose --profile dind up
  #
  # The privileged mode is required by the DinD daemon. The image is
  # pinned to a specific version to avoid silent upgrades.
  #
  # TLS is enabled (DOCKER_TLS_CERTDIR=/certs) so the daemon listens on
  # port 2376 with mutual TLS instead of port 2375 without encryption.
  # Client certificates are generated on first start under /certs/client
  # and shared with the web/worker services through the `dind_certs`
  # volume. See `dind-certs-perms` below for the non-root readability fix.
  dind:
    profiles:
      - dind
    image: docker.io/library/docker:29.8.1-dind
    hostname: dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - dind_data:/var/lib/docker
      - dind_certs:/certs
      - workspace:/var/scancodeio/workspace/
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "docker info && test -f /certs/client/ca.pem"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot helper: the dind daemon writes the client certificates with
  # mode 0600 owned by root. The ScanCode.io containers run as a non-root
  # user and cannot read them. This service runs once after
  # dind is healthy and makes the certs readable.
  dind-certs-perms:
    profiles:
      - dind
    image: docker.io/library/alpine:3.24.2
    command:
      - sh
      - -c
      - chmod -R a+rX /certs/client
    volumes:
      - dind_certs:/certs
    depends_on:
      dind:
        condition: service_healthy
    restart: "no"

  web:
    image: ghcr.io/aboutcode-org/scancode.io:v38.1.0-full
    command: sh -c "
        ./manage.py migrate &&
        ./manage.py collectstatic --no-input --verbosity 0 --clear &&
        gunicorn scancodeio.wsgi:application --bind :8000 --timeout 600 \
          --workers ${GUNICORN_WORKERS:-8} --worker-tmp-dir /dev/shm"
    env_file:
      - docker.env
    expose:
      - 8000
    volumes:
      - .env:/opt/scancodeio/.env
      - /etc/scancodeio/:/etc/scancodeio/
      - workspace:/var/scancodeio/workspace/
      - static:/var/scancodeio/static/
      - healthycode_venv:/opt/healthycode
      - dind_certs:/certs:ro
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      dind:
        condition: service_healthy
        required: false
      dind-certs-perms:
        condition: service_completed_successfully
        required: false

  worker:
    image: ghcr.io/aboutcode-org/scancode.io:v38.1.0-full
    # Ensure that potential db migrations run first by waiting until "web" is up
    command: wait-for-it --strict --timeout=600 web:8000 -- sh -c "
        ./manage.py rqworker --worker-class scancodeio.worker.ScanCodeIOWorker
                             --queue-class scancodeio.worker.ScanCodeIOQueue
                             --verbosity 1"
    env_file:
      - docker.env
    volumes:
      - .env:/opt/scancodeio/.env
      - /etc/scancodeio/:/etc/scancodeio/
      - workspace:/var/scancodeio/workspace/
      - healthycode_venv:/opt/healthycode
      - dind_certs:/certs:ro
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
      dind:
        condition: service_healthy
        required: false
      dind-certs-perms:
        condition: service_completed_successfully
        required: false

  nginx:
    image: docker.io/library/nginx:1.31.7-alpine
    ports:
      - "${NGINX_PUBLISHED_HTTP_PORT:-80}:80"
      - "${NGINX_PUBLISHED_HTTPS_PORT:-443}:443"
    volumes:
      - ./etc/nginx/conf.d/:/etc/nginx/conf.d/
      - static:/var/scancodeio/static/
      - webroot:/var/www/html/
    depends_on:
      web:
        condition: service_started
    restart: always

  clamav:
    image: docker.io/clamav/clamav:1.5.4_base
    volumes:
      - clamav_data:/var/lib/clamav
      - workspace:/var/scancodeio/workspace/
    restart: always

  healthycode:
    profiles:
      - healthycode
    image: ghcr.io/aboutcode-org/healthycode:0.2.0
    volumes:
      - healthycode_venv:/opt/healthycode
    restart: "no"

volumes:
  db_data:
  dind_data:
  dind_certs:
  redis_data:
  clamav_data:
  static:
  workspace:
  webroot:
  healthycode_venv:
